services:
  - type: web
    name: infersql
    runtime: python
    plan: free
    buildCommand: bash deploy/build.sh
    startCommand: cd backend && python -m uvicorn app.hosted:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: NODE_VERSION
        value: "22.16.0"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
